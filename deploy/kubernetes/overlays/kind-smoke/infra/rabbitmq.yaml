apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.6-management
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: fulfillment }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: smoke-infra, key: RABBIT_PASSWORD }
          ports:
            - { name: amqp, containerPort: 5672 }
          # A TCP probe, not rabbitmq-diagnostics: an exec probe that runs before the broker starts
          # creates the Erlang cookie as root, and the broker then cannot read it (eacces).
          readinessProbe:
            tcpSocket: { port: amqp }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
