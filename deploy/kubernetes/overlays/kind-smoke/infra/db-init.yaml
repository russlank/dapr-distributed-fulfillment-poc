apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
          command: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P \"$SA_PASSWORD\" -b -i /init/init.sql"]
          env:
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: smoke-infra, key: ORDER_DB_PASSWORD }
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: smoke-infra, key: INVENTORY_DB_PASSWORD }
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: smoke-infra, key: PAYMENT_DB_PASSWORD }
            - name: SHIPPING_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: smoke-infra, key: SHIPPING_DB_PASSWORD }
            - name: CARRIER_SIM_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: smoke-infra, key: CARRIER_SIM_DB_PASSWORD }
            - name: PAYMENT_PROVIDER_SIM_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: smoke-infra, key: PAYMENT_PROVIDER_SIM_DB_PASSWORD }
            - name: DAPR_STATE_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: smoke-infra, key: DAPR_STATE_DB_PASSWORD }
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: smoke-infra, key: SA_PASSWORD }
          volumeMounts:
            - { name: init, mountPath: /init, readOnly: true }
      volumes:
        - name: init
          configMap: { name: db-init-sql }
