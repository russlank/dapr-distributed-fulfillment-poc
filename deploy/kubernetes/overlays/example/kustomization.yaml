# Example overlay: the base plus secrets from local files and images from your registry.
# Copy each *.env.example to *.env (git-ignored), fill them in, set the registry and tag below,
# and set SQL_HOST and the OTLP endpoint in ../../base/settings.yaml (or patch them here).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
secretGenerator:
  - name: fulfillment-secrets
    namespace: fulfillment
    envs: [secrets.env]
  - name: fulfillment-dapr-api-token
    namespace: fulfillment
    envs: [dapr-api-token.env]
  - name: fulfillment-app-api-token
    namespace: fulfillment
    envs: [app-api-token.env]
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: fulfillment/order-api
    newName: registry.example.com/fulfillment/order-api
    newTag: "0.6.0"
  - name: fulfillment/workflow-host
    newName: registry.example.com/fulfillment/workflow-host
    newTag: "0.6.0"
  - name: fulfillment/compute-worker
    newName: registry.example.com/fulfillment/compute-worker
    newTag: "0.6.0"
  - name: fulfillment/inventory-service
    newName: registry.example.com/fulfillment/inventory-service
    newTag: "0.6.0"
  - name: fulfillment/payment-service
    newName: registry.example.com/fulfillment/payment-service
    newTag: "0.6.0"
  - name: fulfillment/shipping-service
    newName: registry.example.com/fulfillment/shipping-service
    newTag: "0.6.0"
  - name: fulfillment/carrier-simulator
    newName: registry.example.com/fulfillment/carrier-simulator
    newTag: "0.6.0"
  - name: fulfillment/payment-provider-simulator
    newName: registry.example.com/fulfillment/payment-provider-simulator
    newTag: "0.6.0"
