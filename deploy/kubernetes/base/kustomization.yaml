# Generic Kubernetes template for the fulfillment services (Kustomize base). Not verified on a cluster:
# it is rendered with `kubectl kustomize` only. See ../README.md for prerequisites and the differences
# from the Compose stack.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fulfillment
resources:
  - namespace.yaml
  - settings.yaml
  - dapr/configuration.yaml
  - dapr/statestore.yaml
  - dapr/pubsub.yaml
  - dapr/resiliency.yaml
  - apps/order-api.yaml
  - migrations/order-api-migrate.yaml
  - apps/workflow-host.yaml
  - apps/compute-worker.yaml
  - apps/inventory-service.yaml
  - migrations/inventory-service-migrate.yaml
  - apps/payment-service.yaml
  - migrations/payment-service-migrate.yaml
  - apps/shipping-service.yaml
  - migrations/shipping-service-migrate.yaml
  - simulators/carrier-simulator.yaml
  - simulators/payment-provider-simulator.yaml

# Secrets are not part of the base: an overlay supplies fulfillment-secrets,
# fulfillment-dapr-api-token and fulfillment-app-api-token (see overlays/example), or your
# secret manager creates them.

# Images are named fulfillment/<role> without a tag; an overlay sets the registry and tag.
