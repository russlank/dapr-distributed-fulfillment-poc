apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-provider-simulator
  labels: { app.kubernetes.io/name: payment-provider-simulator, app.kubernetes.io/part-of: fulfillment }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: payment-provider-simulator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: payment-provider-simulator, app.kubernetes.io/part-of: fulfillment }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: fulfillment/payment-provider-simulator
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: REPLICA_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: DAPR_POC_ENV
              valueFrom:
                configMapKeyRef: { name: fulfillment-settings, key: DAPR_POC_ENV }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: fulfillment-settings, key: OTEL_EXPORTER_OTLP_ENDPOINT }
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
            - name: PAYMENT_PROVIDER_SIM_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: fulfillment-secrets, key: PAYMENT_PROVIDER_SIM_DB_PASSWORD }
            - name: SQL_HOST
              valueFrom:
                configMapKeyRef: { name: fulfillment-settings, key: SQL_HOST }
            - name: ConnectionStrings__PaymentProviderSimDb
              value: "Server=$(SQL_HOST);Database=PaymentProviderSimDb;User Id=payment_provider_sim;Password=$(PAYMENT_PROVIDER_SIM_DB_PASSWORD);TrustServerCertificate=true"
            - name: PROVIDER_API_KEY
              valueFrom:
                secretKeyRef: { name: fulfillment-secrets, key: PROVIDER_API_KEY }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }

---
apiVersion: v1
kind: Service
metadata:
  name: payment-provider-simulator
  labels: { app.kubernetes.io/name: payment-provider-simulator, app.kubernetes.io/part-of: fulfillment }
spec:
  selector: { app.kubernetes.io/name: payment-provider-simulator }
  ports:
    - { name: http, port: 8080, targetPort: http }
