apiVersion: batch/v1
kind: Job
metadata:
  name: order-api-migrate
  labels: { app.kubernetes.io/name: order-api-migrate, app.kubernetes.io/part-of: fulfillment }
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app.kubernetes.io/name: order-api-migrate }
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: fulfillment/order-api
          args: ["migrate"]
          env:
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: fulfillment-secrets, key: ORDER_DB_PASSWORD }
            - name: SQL_HOST
              valueFrom:
                configMapKeyRef: { name: fulfillment-settings, key: SQL_HOST }
            - name: ConnectionStrings__OrderDb
              value: "Server=$(SQL_HOST);Database=OrderDb;User Id=order_api;Password=$(ORDER_DB_PASSWORD);TrustServerCertificate=true"
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 256Mi }
