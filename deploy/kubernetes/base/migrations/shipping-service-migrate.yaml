apiVersion: batch/v1
kind: Job
metadata:
  name: shipping-service-migrate
  labels: { app.kubernetes.io/name: shipping-service-migrate, app.kubernetes.io/part-of: fulfillment }
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app.kubernetes.io/name: shipping-service-migrate }
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: fulfillment/shipping-service
          args: ["migrate"]
          env:
            - name: SHIPPING_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: fulfillment-secrets, key: SHIPPING_DB_PASSWORD }
            - name: SQL_HOST
              valueFrom:
                configMapKeyRef: { name: fulfillment-settings, key: SQL_HOST }
            - name: ConnectionStrings__ShippingDb
              value: "Server=$(SQL_HOST);Database=ShippingDb;User Id=shipping_service;Password=$(SHIPPING_DB_PASSWORD);TrustServerCertificate=true"
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 256Mi }
