global:
  # Short intervals so that drills can see an alert fire and resolve within minutes.
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # Dapr sidecar metrics: each sidecar shares its app's network namespace, port 9090.
  - job_name: dapr-sidecars
    static_configs:
      - targets:
          - order-api:9090
          - workflow-host:9090
          - compute-worker:9090
          - inventory-service:9090
          - payment-service:9090
          - shipping-service:9090
