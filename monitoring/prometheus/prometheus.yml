global:
  scrape_interval: 15s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # Dapr sidecar metrics: each sidecar shares its app's network namespace, port 9090.
  - job_name: dapr-sidecars
    static_configs:
      - targets:
          - order-api:9090
          - workflow-host:9090
          - compute-worker:9090
          - inventory-service:9090
          - payment-service:9090
          - shipping-service:9090
