      CUSTOMER_API_KEY: ${CUSTOMER_API_KEY:?set CUSTOMER_API_KEY in .env}
    ports:
      - "127.0.0.1:8081:8080"
  order-api-2-dapr:
    <<: *daprd
    profiles: [replicas]
    network_mode: "service:order-api-2"
    command: ["./daprd", "--app-id", "order-api", "--app-port", "8080", "--dapr-http-port", "3500", "--dapr-grpc-port", "50001", "--metrics-port", "9090",
              "--placement-host-address", "placement:50005", "--scheduler-host-address", "scheduler:50006",
              "--resources-path", "/dapr/components", "--config", "/dapr/config/fulfillment.yaml", "--log-level", "info"]
    depends_on:
      order-api-2:
        condition: service_started
      placement:
        condition: service_started
      scheduler:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      toxiproxy:
        condition: service_started

  workflow-host:
