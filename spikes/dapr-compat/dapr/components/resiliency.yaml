# A10/A11: bounded retries for pub/sub delivery and for service invocation of the worker.
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: spike-resiliency
spec:
  policies:
    retries:
      pubsubRetry:
        policy: constant
        duration: 1s
        maxRetries: 2
      invokeRetry:
        policy: constant
        duration: 300ms
        maxRetries: 3
        matching:
          httpStatusCodes: "500-599"
  targets:
    apps:
      spike-worker:
        retry: invokeRetry
    components:
      pubsub:
        inbound:
          retry: pubsubRetry
