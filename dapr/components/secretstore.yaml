# Secrets come from the sidecar environment (values from .env), never from these files.
# The local.env store refuses variables whose names start with DAPR_ (observed), hence STATE_STORE_CONN.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: envsecrets
spec:
  type: secretstores.local.env
  version: v1
