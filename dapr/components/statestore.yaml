# Workflow history and actor state. Component version v2 is required: v1 stores values as
# NVARCHAR text and corrupts binary workflow history (observed with Dapr 1.19.1, docs/versions.md).
# Sidecars reach DaprStateDb through Toxiproxy, so drills can cut only this path.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.sqlserver
  version: v2
  metadata:
    - name: connectionString
      secretKeyRef:
        name: STATE_STORE_CONN
        key: STATE_STORE_CONN
    - name: databaseName
      value: DaprStateDb
    - name: tableName
      value: state
    - name: actorStateStore
      value: "true"
auth:
  secretStore: envsecrets
scopes: [order-api, workflow-host, compute-worker, inventory-service, payment-service, shipping-service]
