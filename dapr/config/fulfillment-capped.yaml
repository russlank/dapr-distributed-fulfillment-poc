# Sidecar configuration with a low activity concurrency cap, for the concurrency scenario (S17): compute-worker
# sidecars started with COMPUTE_DAPR_CONFIG=fulfillment-capped.yaml run at most two activities at a time each.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: fulfillment-capped
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: "otel-collector:4317"
      isSecure: false
      protocol: grpc
  metric:
    enabled: true
  workflow:
    maxConcurrentWorkflowInvocations: 100
    maxConcurrentActivityInvocations: 2
