# Sidecar configuration for every Dapr-enabled role.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: fulfillment
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: "otel-collector:4317"
      isSecure: false
      protocol: grpc
  metric:
    enabled: true
  # Workflow concurrency is a sidecar setting; the .NET SDK options are obsolete and inert in 1.19.
  workflow:
    maxConcurrentWorkflowInvocations: 100
    maxConcurrentActivityInvocations: 100
